parameters:
    env(APP_ENV): 'dev'
    env(APP_SECRET): 'your_secret_here'
    env(OBJECT_STORAGE_DRIVER): 'local'
    env(OBJECT_STORAGE_BUCKET): ''
    env(OBJECT_STORAGE_REGION): ''
    env(OBJECT_STORAGE_ENDPOINT): ''
    env(OBJECT_STORAGE_ACCESS_KEY): ''
    env(OBJECT_STORAGE_SECRET_KEY): ''
    env(OBJECT_STORAGE_PATH_STYLE): '1'
    env(UPLOAD_SCAN_ENABLED): '0'
    env(UPLOAD_SCAN_BINARY): 'clamscan'
    env(UPLOAD_SCAN_TIMEOUT_SECONDS): '20'
    env(UPLOAD_SCAN_FAIL_CLOSED): '1'
    delivery.attachments.upload_dir: '%kernel.project_dir%/var/uploads/deliveries'
    delivery.attachments.legacy_public_upload_dir: '%kernel.project_dir%/public/uploads/deliveries'
    vendor.resume.upload_dir: '%kernel.project_dir%/var/uploads/vendor-resumes'
    ai.trust.weights:
        rating: 0.22
        escrow_release_ratio: 0.23
        on_time_delivery_ratio: 0.18
        refund_ratio_inverse: 0.15
        dispute_rate_inverse: 0.12
        volume: 0.10
    ai.trust.volume_cap_minor: 100000000
    ai.trust.medium_risk_threshold: 70.0
    ai.trust.high_risk_threshold: 45.0
    ai.escrow_risk.high_amount_threshold_minor: 500000
    ai.escrow_risk.first_client_large_amount_threshold_minor: 200000
    ai.escrow_risk.vendor_dispute_rate_threshold: 0.25
    ai.escrow_risk.manual_review_threshold: 72.0
    ai.escrow_risk.weights:
        client: 0.30
        vendor: 0.30
        amount: 0.25
        geo: 0.15
        anomaly_boost: 10
    ai.escrow_risk.currency_factor:
        TZS: 30
        KES: 35
        UGX: 40
        USD: 55
    ai.matching.weights:
        trust_score: 0.40
        relevance: 0.25
        price_fit: 0.20
        historical_similarity: 0.15
    ai.metrics.high_risk_threshold: 70.0
    ai.metrics.snapshot_stale_hours: 30
    ai.user_risk.thresholds:
        new_account_days: 7
        repeated_failed_logins: 3
        low_trust_score: 60
        recent_signal_lookback_hours: 24
    ai.user_risk.weights:
        new_account: 15
        repeated_failed_logins: 20
        low_trust_score: 25
        recent_signal_count: 4
        recent_signal_severity_multiplier: 0.35
    ai.transaction_monitor.thresholds:
        velocity_window_minutes: 10
        velocity_count: 5
        high_velocity_score_boost: 30
        large_payment_amount_minor: 500000
        large_payment_score_boost: 20
        fail_threshold: 80
        pending_threshold: 60
    ai.behavior.thresholds:
        amount_spike_multiplier: 3
        unusual_hour_gap: 5
    ai.behavior.weights:
        amount_spike: 25
        unusual_hour: 15
    snippe.webhook.max_skew_seconds: 300

services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    # Load whole src except these
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Domain/'
            - '../src/Kernel.php'

    # Controllers must be public
    App\Controller\:
        resource: '../src/Controller/'
        public: true
        tags: ['controller.service_arguments']

    # Explicit service definition (example: JwtService)
    App\Service\JwtService:
        arguments:
            $privateKeyPath: '%kernel.project_dir%/config/jwt/private.pem'
            $publicKeyPath: '%kernel.project_dir%/config/jwt/public.pem'
            $accessTtl: 3600
            $refreshTtl: 604800

    App\Http\AuthCookies: ~

    App\Security\JwtAuthenticator:
        arguments:
            $authCookies: '@App\Http\AuthCookies'

    App\Service\SnippeClient:
        arguments:
            $apiKey: '%env(SNIPPE_API_KEY)%'
            $baseUrl: '%env(SNIPPE_BASE_URL)%'
            $webhookSecret: '%env(SNIPPE_WEBHOOK_SECRET)%'

    App\Service\ConfigurableObjectStorage:
        arguments:
            $driver: '%env(string:OBJECT_STORAGE_DRIVER)%'
            $localFilesystemObjectStorage: '@App\Service\LocalFilesystemObjectStorage'
            $s3CompatibleObjectStorage: '@App\Service\S3CompatibleObjectStorage'

    App\Service\ObjectStorageInterface: '@App\Service\ConfigurableObjectStorage'

    App\Service\S3CompatibleObjectStorage:
        arguments:
            $driver: '%env(string:OBJECT_STORAGE_DRIVER)%'
            $bucket: '%env(default::OBJECT_STORAGE_BUCKET)%'
            $region: '%env(default::OBJECT_STORAGE_REGION)%'
            $endpoint: '%env(default::OBJECT_STORAGE_ENDPOINT)%'
            $accessKey: '%env(default::OBJECT_STORAGE_ACCESS_KEY)%'
            $secretKey: '%env(default::OBJECT_STORAGE_SECRET_KEY)%'
            $pathStyle: '%env(bool:OBJECT_STORAGE_PATH_STYLE)%'

    App\Service\DeliveryAttachmentStorage:
        arguments:
            $uploadDir: '%delivery.attachments.upload_dir%'
            $legacyPublicUploadDir: '%delivery.attachments.legacy_public_upload_dir%'
            $objectStorage: '@App\Service\ObjectStorageInterface'
            $uploadedFileSecurityInspector: '@App\Service\UploadedFileSecurityInspector'
            $uploadMalwareScanner: '@App\Service\UploadMalwareScanner'

    App\Service\DeliverySubmissionLifecycleService:
        public: true

    App\Service\VendorResumeStorage:
        arguments:
            $uploadDir: '%vendor.resume.upload_dir%'
            $objectStorage: '@App\Service\ObjectStorageInterface'
            $uploadedFileSecurityInspector: '@App\Service\UploadedFileSecurityInspector'
            $uploadMalwareScanner: '@App\Service\UploadMalwareScanner'

    App\Service\UploadMalwareScanner:
        arguments:
            $enabled: '%env(bool:UPLOAD_SCAN_ENABLED)%'
            $binaryPath: '%env(string:UPLOAD_SCAN_BINARY)%'
            $timeoutSeconds: '%env(int:UPLOAD_SCAN_TIMEOUT_SECONDS)%'
            $failClosed: '%env(bool:UPLOAD_SCAN_FAIL_CLOSED)%'

    App\Service\OperationsDiagnosticsService:
        arguments:
            $objectStorageDriver: '%env(string:OBJECT_STORAGE_DRIVER)%'
            $uploadScanEnabled: '%env(bool:UPLOAD_SCAN_ENABLED)%'
            $uploadScanBinary: '%env(string:UPLOAD_SCAN_BINARY)%'
            $uploadScanTimeoutSeconds: '%env(int:UPLOAD_SCAN_TIMEOUT_SECONDS)%'
            $uploadScanFailClosed: '%env(bool:UPLOAD_SCAN_FAIL_CLOSED)%'
            $appEnv: '%env(string:APP_ENV)%'

    App\Service\SignedDownloadTokenService:
        arguments:
            $appSecret: '%env(string:APP_SECRET)%'

    App\Service\SignedObjectTransferTokenService:
        arguments:
            $appSecret: '%env(string:APP_SECRET)%'

    App\EventSubscriber\TransactionSubscriber:
        tags: ['doctrine.event_subscriber']

    App\EventSubscriber\ReviewTrustSubscriber:
        tags: ['doctrine.event_subscriber']

    App\EventListener\DeliveryAttachmentCleanupListener:
        tags:
            - { name: 'doctrine.orm.entity_listener', event: 'preRemove', entity: 'App\Entity\DeliveryAttachment', method: 'preRemoveAttachment' }
            - { name: 'doctrine.orm.entity_listener', event: 'preRemove', entity: 'App\Entity\DeliverySubmission', method: 'preRemoveSubmission' }

    App\Service\SnippeWebhookValidator:
        arguments:
            $maxSkewSeconds: '%snippe.webhook.max_skew_seconds%'

    App\Service\VendorTrustCalculator:
        arguments:
            $notificationService: '@App\Service\NotificationService'
            $userRepository: '@App\Repository\UserRepository'
            $weights: '%ai.trust.weights%'
            $volumeCapMinor: '%ai.trust.volume_cap_minor%'
            $mediumRiskThreshold: '%ai.trust.medium_risk_threshold%'
            $highRiskThreshold: '%ai.trust.high_risk_threshold%'

    App\Service\EscrowRiskEvaluator:
        arguments:
            $highAmountThresholdMinor: '%ai.escrow_risk.high_amount_threshold_minor%'
            $firstClientLargeAmountThresholdMinor: '%ai.escrow_risk.first_client_large_amount_threshold_minor%'
            $vendorDisputeRateThreshold: '%ai.escrow_risk.vendor_dispute_rate_threshold%'
            $manualReviewThreshold: '%ai.escrow_risk.manual_review_threshold%'
            $weights: '%ai.escrow_risk.weights%'
            $currencyRiskMap: '%ai.escrow_risk.currency_factor%'

    App\Service\PlatformMetricsSnapshotService:
        arguments:
            $highRiskEscrowThreshold: '%ai.metrics.high_risk_threshold%'

    App\Service\PlatformMetricsHealthService:
        arguments:
            $staleThresholdHours: '%ai.metrics.snapshot_stale_hours%'

    App\Service\RiskEngineService:
        arguments:
            $thresholds: '%ai.user_risk.thresholds%'
            $weights: '%ai.user_risk.weights%'

    App\Service\TransactionMonitorService:
        arguments:
            $thresholds: '%ai.transaction_monitor.thresholds%'

    App\Service\BehaviorAnalyzerService:
        arguments:
            $thresholds: '%ai.behavior.thresholds%'
            $weights: '%ai.behavior.weights%'

    App\Service\Matching\RuleBasedMatchingStrategy:
        arguments:
            $weights: '%ai.matching.weights%'

    App\Service\Matching\MatchingStrategyInterface: '@App\Service\Matching\RuleBasedMatchingStrategy'
